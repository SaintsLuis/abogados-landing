      height: 100%;

      right: 18px;

.submit}<span className="sera-btn__arrow" aria-hidden="true">→</span></button></div></form>) : (<div className="sera-modal__done" role="status" aria-live="polite"><div className="sera-modal__seal" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="24" cy="24" r="20" /><path d="M14 24 L21 31 L34 17" /></svg></div><h3 id={titleId} className="sera-modal__t">{t.eval.done_t}</h3><p className="sera-modal__s">{t.eval.done_d}</p><button type="button" className="sera-btn sera-btn--ghost" onClick={onClose}>{t.eval.close}</button></div>)}</div></div>); };
    const WhatsApp = ({ t }) => { const [hover, setHover] = useState(false); const waNum = (t.contact && t.contact.wa ? t.contact.wa : "+1 415 555 0142").replace(/[^\d]/g, ""); return (<div className="sera-wa" onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)} onFocusCapture={() => setHover(true)} onBlurCapture={() => setHover(false)}><div className={`sera-wa__tip ${hover ? "is-on" : ""}`} aria-hidden="true"><div className="sera-wa__tip-l">{t.wa.label}</div><div className="sera-wa__tip-s">{t.wa.tip}</div></div><a className="sera-wa__btn" href={`https://wa.me/${waNum}`} target="_blank" rel="noopener noreferrer" aria-label={`${t.wa.label} — ${t.wa.tip}`}><svg viewBox="0 0 32 32" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M16 3C8.8 3 3 8.8 3 16c0 2.4.7 4.7 1.9 6.7L3 29l6.5-1.8c1.9 1 4.1 1.6 6.5 1.6 7.2 0 13-5.8 13-13S23.2 3 16 3zm0 23.6c-2.1 0-4.1-.6-5.8-1.6l-.4-.2-3.9 1 1-3.8-.3-.4C5.5 19.9 4.9 18 4.9 16 4.9 9.9 9.9 4.9 16 4.9S27.1 9.9 27.1 16 22.1 26.6 16 26.6zm6.1-8c-.3-.2-2-1-2.3-1.1-.3-.1-.5-.2-.8.2s-.9 1.1-1.1 1.3c-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.6-1.6-1-.9-1.6-2-1.8-2.3-.2-.3 0-.5.1-.7l.5-.6c.2-.2.2-.3.4-.5.1-.2.1-.4 0-.5-.1-.2-.8-1.9-1.1-2.6-.3-.7-.6-.6-.8-.6h-.7c-.2 0-.6.1-.9.4-.3.3-1.2 1.2-1.2 2.9 0 1.7 1.2 3.4 1.4 3.6.2.2 2.4 3.7 5.9 5.2.8.4 1.5.6 2 .7.8.3 1.6.2 2.2.1.7-.1 2-.8 2.3-1.6.3-.8.3-1.5.2-1.6-.1-.1-.3-.2-.6-.4z" /></svg></a></div>); };
    function shade (hex, pct) { const h = hex.replace("#", ""); const r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16); const f = pct / 100; return `#${[Math.round(r + (255 - r) * f), Math.round(g + (255 - g) * f), Math.round(b + (255 - b) * f)].map(c => c.toString(16).padStart(2, "0")).join("")}`; }
    function SeraLanding ({ artboard = "desktop" }) { const DEFAULTS = { lang: "en", heroVariant: "portrait", accent: "#c9a96e", showWhatsApp: true, areasCount: 6 }; const [tweaks, setTweaks] = useState(DEFAULTS); const setTweak = (k, v) => setTweaks(p => ({ ...p, [k]: v })); const lang = tweaks.lang; const t = COPY[lang] || COPY.en; const [evalOpen, setEvalOpen] = useState(false); const [openMobileNav, setOpenMobileNav] = useState(false); useEffect(() => { try { document.documentElement.lang = lang; document.title = `Sera Immigration Law — ${t.hero.title_a} ${t.hero.title_b} ${t.hero.title_c}`; const desc = document.querySelector('meta[name="description"]'); if (desc) desc.setAttribute("content", t.hero.sub); } catch (_) { } }, [lang]); const accentStyle = useMemo(() => ({ "--sera-gold": tweaks.accent, "--sera-gold-2": shade(tweaks.accent, 8), "--sera-gold-soft": shade(tweaks.accent, 35) }), [tweaks.accent]); return (<div className="sera-root" style={accentStyle}><TopNav lang={lang} setLang={v => setTweak("lang", v)} t={t} onCTA={() => setEvalOpen(true)} openMobileNav={openMobileNav} setOpenMobileNav={setOpenMobileNav} /><Hero t={t} onCTA={() => setEvalOpen(true)} variant={tweaks.heroVariant} /><TrustBar t={t} /><Practice t={t} count={tweaks.areasCount} /><Promise_ t={t} /><Process t={t} /><Team t={t} /><Stories t={t} /><Contact t={t} onCTA={() => setEvalOpen(true)} /><Footer t={t} /><EvalModal open={evalOpen} onClose={() => setEvalOpen(false)} t={t} />{tweaks.showWhatsApp && <WhatsApp t={t} />}</div>); }
